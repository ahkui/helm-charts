{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.fullname" . }}
  {{- with (.Values.httproute.annotations) }}
  annotations:
    {{- tpl (. | toYaml) $ | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- .Values.httproute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . }}
    {{- end }}
  rules:
    {{- range $rule := .Values.httproute.rules }}
    - matches: {{ $rule.matches | toYaml | nindent 8 }}
      {{- with $rule.name }}
      name: {{ . }}
      {{- end }}
      {{- with $rule.timeouts }}
      timeouts:
        {{- tpl (. | toYaml) $ | nindent 8 }}
      {{- end }}
      {{- with $rule.filters }}
      filters:
        {{- tpl (. | toYaml) $ | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "common.fullname" $ }}
          {{- if or (kindIs "int" $rule.port) (kindIs "float64" $rule.port) }}
          port: {{ $rule.port }}
          {{- else if kindIs "string" $rule.port }}
          port: {{ (get $.Values.service.ports $rule.port).servicePort }}
          {{- else if $.Values.service.ports.http.enabled }}
          port: {{ $.Values.service.ports.http.servicePort }}
          {{- else }}
          port: 80
          {{- end }}
    {{- end }}
{{- end }}
